name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - run: python -m pip install -r requirements-delivery.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run preview -- --port 4173 &
      - run: python scripts/verify_delivery.py --base-url http://127.0.0.1:4173 --sha ${{ github.sha }} --expect-version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-review-${{ github.sha }}
          path: delivery-reports/${{ github.sha }}
          if-no-files-found: ignore
